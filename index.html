<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MR. RUBEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e3343a;--red2:#8e1c22;--amber:#f2b45a;--paper:#eadfc6;--ink:#0d0e12;--bg:#07080b;
  --panel:#101219;--panel2:#161923;--line:#2a2f3c;--txt:#d9dce4;--dim:#878ea0;--green:#7cf0a4;
  --blue:#6fb3ff;--yellow:#f4d35e;--cork:#3a2a1c;
  --f-pix:'Press Start 2P',monospace;--f-mono:'IBM Plex Mono','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;font-family:var(--f-mono);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
input{font:inherit;user-select:text;-webkit-user-select:text}
#cv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#crt{position:fixed;inset:0;pointer-events:none;z-index:70;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
#crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#crt::before{content:'';position:absolute;inset:0;background:rgba(255,240,220,.025);animation:flick 4s infinite steps(1)}
@keyframes flick{0%,100%{opacity:.6}47%{opacity:1}48%{opacity:.3}50%{opacity:.9}}
body.nocrt #crt{display:none}
.hidden{display:none!important}
@keyframes blink{50%{opacity:0}}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none;z-index:20}
#hud .info{background:linear-gradient(90deg,rgba(7,8,11,.88),rgba(7,8,11,.55) 70%,rgba(7,8,11,0));padding:8px 28px 9px 10px;border-left:3px solid var(--red);max-width:58vw}
#hud .ep{font-family:var(--f-pix);font-size:9px;color:var(--red);letter-spacing:1px;line-height:1.5}
#hud .when{font-family:var(--f-pix);font-size:8px;color:var(--dim);margin-top:5px}
#hud .goal{font-size:13px;margin-top:7px;color:var(--txt);line-height:1.35}
#hud .goal::before{content:'▸ ';color:var(--amber)}
#hud .btns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.hbtn{width:44px;height:44px;background:rgba(13,14,18,.88);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.hbtn canvas{width:24px;height:24px;image-rendering:pixelated}
.hbtn:hover{border-color:var(--red)}
.hbtn .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;background:var(--red);border-radius:50%;box-shadow:0 0 6px var(--red)}
.hbtn .k{position:absolute;bottom:1px;right:3px;font-size:9px;color:var(--dim);font-family:var(--f-mono)}
body.touch .hbtn .k{display:none}

/* ---------- prompt & thought ---------- */
#prompt{position:fixed;z-index:24;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#prompt .lbl{font-size:12px;color:#f3ead7;text-shadow:0 1px 0 #000,0 0 6px #000,0 0 2px #000;white-space:nowrap}
#prompt .key{min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#0d0e12;border:2px solid #f3ead7;color:#f3ead7;font-family:var(--f-pix);font-size:8px;display:grid;place-items:center}
#thought{position:fixed;z-index:26;transform:translate(-50%,-100%);max-width:min(360px,72vw);font-style:italic;font-size:14px;line-height:1.4;color:#efe8d8;
  background:rgba(10,10,14,.78);padding:7px 12px 9px;border:1px dashed rgba(239,232,216,.35);pointer-events:none;transition:opacity .35s;text-align:center;opacity:0}
#thought.on{opacity:1}
#thought::before{content:'— мысли —';display:block;font-style:normal;font-family:var(--f-pix);font-size:7px;color:var(--amber);margin-bottom:5px;letter-spacing:1px}

/* ---------- dialogue ---------- */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(880px,calc(100vw - 24px));
  background:rgba(9,10,14,.95);border:1px solid var(--line);border-top:3px solid var(--red);display:flex;gap:14px;padding:14px 16px 16px;z-index:30;animation:pop .2s}
#dlg .portrait{width:104px;height:104px;flex:none;image-rendering:pixelated;background:#0b0c10;border:1px solid var(--line)}
#dlg .main{flex:1;min-width:0;position:relative}
#dlg .name{font-family:var(--f-pix);font-size:10px;color:var(--red);margin-bottom:9px;letter-spacing:1px}
#dlg .text{font-size:16px;line-height:1.5;min-height:3em}
#dlg .choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choice{background:#151821;border:1px solid var(--line);text-align:left;padding:9px 11px;font-size:14px;cursor:pointer;line-height:1.35}
.choice:hover,.choice.sel{border-color:var(--red);background:#1d202b}
.choice.seen{color:var(--dim)}
#dlg .next{position:absolute;right:0;bottom:-6px;font-size:12px;color:var(--dim);animation:blink 1s steps(2) infinite}
#dlg.narr{border-top-color:var(--amber)} #dlg.narr .name{color:var(--amber)}
#dlg.narr .text{font-style:italic}

/* ---------- generic overlay/panel ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(4,5,8,.84);display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));animation:pop .18s}
.panel{width:min(1040px,100%);height:min(700px,100%);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);display:flex;flex-direction:column;min-height:0}
.panel.small{width:min(560px,100%);height:auto;max-height:100%}
.panel header{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel h2{font-family:var(--f-pix);font-size:12px;margin:0;flex:1;letter-spacing:1px;line-height:1.5}
.xbtn{background:none;border:1px solid var(--line);width:36px;height:36px;cursor:pointer;font-size:16px}
.xbtn:hover{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{background:none;border:1px solid transparent;border-bottom:none;padding:9px 12px;cursor:pointer;font-family:var(--f-pix);font-size:8px;color:var(--dim);white-space:nowrap}
.tab.on{color:var(--txt);border-color:var(--line);background:var(--panel2)}
.panel .body{flex:1;overflow:auto;padding:14px;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.muted{color:var(--dim)}
.btn{background:#1a1d27;border:1px solid var(--line);padding:10px 14px;cursor:pointer;font-family:var(--f-pix);font-size:9px;letter-spacing:1px}
.btn:hover,.btn:focus{border-color:var(--red);outline:none}
.btn.red{background:var(--red2);border-color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* inventory */
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--panel2);border:1px solid var(--line);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.item:hover,.item.on{border-color:var(--amber)}
.item canvas{width:64px;height:64px;image-rendering:pixelated}
.item b{font-size:13px}
.idesc{margin-top:14px;padding:12px;border:1px dashed var(--line);font-size:14px;line-height:1.5;min-height:60px}
.sect{font-family:var(--f-pix);font-size:9px;color:var(--amber);margin:16px 0 10px;letter-spacing:1px}
.sect:first-child{margin-top:0}

/* suspects */
.suslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.scard{background:#e8dcc0;color:#1b1610;padding:7px 7px 9px;cursor:pointer;position:relative;box-shadow:2px 3px 0 rgba(0,0,0,.5);transform:rotate(var(--r,0deg))}
.scard canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#1a1c22;display:block}
.scard .nm{font-family:var(--f-pix);font-size:8px;margin-top:7px;text-align:center}
.scard .st{font-size:10px;text-align:center;margin-top:4px}
.scard.locked{filter:grayscale(1) brightness(.4);cursor:default}
.scard:hover:not(.locked){outline:2px solid var(--red)}
.sdetail{display:grid;grid-template-columns:180px 1fr;gap:16px}
.sdetail canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#1a1c22;border:6px solid #e8dcc0}
.kv{margin-bottom:12px;font-size:14px;line-height:1.5}
.kv>b{display:block;font-family:var(--f-pix);font-size:8px;color:var(--dim);margin-bottom:5px;letter-spacing:1px}
.status{display:inline-block;padding:3px 8px;font-family:var(--f-pix);font-size:8px;border:1px solid;margin:2px 4px 2px 0;line-height:1.6}
.s-confirmed{color:#7be39a;border-color:#2f7b49}.s-contradiction{color:#f4d35e;border-color:#8a7322}
.s-refuted{color:#ff6b6b;border-color:#8e1c22}.s-unknown{color:#aab;border-color:#555b6b}.s-varya{color:#7ab8ff;border-color:#2c5a8e}
.evmini{padding:7px 9px;border-left:2px solid var(--amber);background:#141720;margin:6px 0;font-size:13px;line-height:1.4}
.evmini .t{color:var(--amber);font-size:11px;font-family:var(--f-pix);margin-right:6px}

/* investigation */
.cork{background:#3a2a1c radial-gradient(circle at 20% 30%,rgba(255,255,255,.04),transparent 40%),repeating-radial-gradient(circle at 0 0,rgba(0,0,0,.08) 0 2px,transparent 2px 5px);}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.evc{background:var(--paper);color:#1d1810;padding:12px 12px 12px;position:relative;box-shadow:2px 3px 0 rgba(0,0,0,.45);transform:rotate(var(--r,0deg));font-size:13px;line-height:1.45}
.evc::before{content:'';position:absolute;top:-5px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3);transform:translateX(-50%)}
.evc h4{margin:2px 0 6px;font-family:var(--f-pix);font-size:8px;line-height:1.6}
.evc .who{font-size:11px;color:#6b5b45;margin-bottom:4px}
.evc .time{position:absolute;right:8px;top:8px;font-size:11px;background:#1d1810;color:var(--paper);padding:1px 5px}
.evc.new{outline:2px solid var(--red)}
.evfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#1a1d27;border:1px solid var(--line);padding:5px 9px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--amber);color:var(--amber)}
.tl{position:relative;padding-left:76px}
.tl::before{content:'';position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--red2)}
.tle{position:relative;margin:0 0 12px;background:#141720;border:1px solid var(--line);padding:8px 10px;font-size:13px;line-height:1.45}
.tle .tt{position:absolute;left:-76px;top:7px;width:56px;text-align:right;font-family:var(--f-pix);font-size:9px;color:var(--amber)}
.tle::before{content:'';position:absolute;left:-19px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.tle .src{font-size:11px;color:var(--dim)}
.tle.unk{opacity:.45}
#linkcv{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.nbtable{width:100%;border-collapse:collapse;font-size:13px}
.nbtable td,.nbtable th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top;line-height:1.45}
.nbtable th{font-family:var(--f-pix);font-size:8px;color:var(--dim)}
.nb-hyp{margin-top:18px;padding:12px;border:1px dashed var(--amber);font-style:italic;line-height:1.5}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:45;background:#000}
#menuCv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#menu .mbtns{position:absolute;display:flex;flex-direction:column;gap:2px}
#menu .mtitle{position:absolute;pointer-events:none}
#titleCv{display:block;width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(227,52,58,.35)) drop-shadow(4px 4px 0 #000)}
#menu .msub{font-family:var(--f-pix);font-size:clamp(8px,1.1vw,12px);color:#cfc4ac;margin-top:14px;letter-spacing:2px;text-shadow:2px 2px 0 #000;text-transform:uppercase}
.mbtn{font-family:var(--f-pix);color:#efe6d2;background:none;border:none;text-align:left;padding:10px 4px;cursor:pointer;text-shadow:3px 3px 0 #000;letter-spacing:1px;white-space:nowrap}
.mbtn:hover,.mbtn:focus,.mbtn.sel{color:var(--red);outline:none}
.mbtn:hover::before,.mbtn:focus::before,.mbtn.sel::before{content:'▸ '}
.mbtn:disabled{opacity:.3;cursor:default}
.mbtn:disabled::before{content:''!important}
#menu .ver{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));font-size:11px;color:#8a8070;text-shadow:1px 1px 0 #000}
#menu .tap{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font-family:var(--f-pix);font-size:10px;color:#efe6d2;animation:blink 1.2s steps(2) infinite;text-shadow:2px 2px 0 #000;white-space:nowrap}
.eplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.epc{background:var(--panel2);border:1px solid var(--line);padding:12px;cursor:pointer;text-align:left}
.epc:hover:not(:disabled){border-color:var(--red)}
.epc .n{font-family:var(--f-pix);font-size:8px;color:var(--red)}
.epc .tt{font-family:var(--f-pix);font-size:10px;margin:9px 0 6px;line-height:1.5}
.epc .d{font-size:12px;color:var(--dim)}
.epc:disabled{opacity:.35;cursor:default}
.set{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center;font-size:14px}
.set input[type=range]{width:min(220px,40vw);accent-color:var(--red)}
.toggle{width:54px;height:28px;border:1px solid var(--line);background:#1a1d27;position:relative;cursor:pointer}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--dim);transition:.15s}
.toggle.on{border-color:var(--red)} .toggle.on::after{left:29px;background:var(--red)}
.keys{font-size:13px;line-height:1.9;color:var(--dim)} .keys kbd{font-family:var(--f-pix);font-size:8px;border:1px solid var(--line);padding:3px 6px;color:var(--txt);background:#151821}

/* ---------- desk close-up ---------- */
#desk{position:fixed;inset:0;z-index:35;background:#000;overflow:hidden}
#deskCv{position:absolute;image-rendering:pixelated}
#desk .hots{position:absolute}
.hot{position:absolute;cursor:pointer;border:1px dashed transparent;background:none;padding:0}
.hot:hover,.hot.sel{border-color:rgba(255,240,200,.7);background:rgba(255,240,200,.07)}
.hot.done::after{content:'✓';position:absolute;right:-6px;top:-8px;font-size:11px;color:var(--green);text-shadow:0 0 3px #000}
.hot .hl{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:12px;background:rgba(0,0,0,.8);padding:3px 7px;color:#f3ead7;display:none;margin-bottom:4px}
.hot:hover .hl,.hot.sel .hl{display:block}
#desk .dtop{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
#desk .dtop>*{pointer-events:auto}
#desk .dtitle{font-family:var(--f-pix);font-size:10px;background:rgba(0,0,0,.75);padding:9px 12px;border-left:3px solid var(--red)}
#desk .dinfo{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(760px,calc(100vw - 24px));background:rgba(9,10,14,.95);border:1px solid var(--line);border-top:3px solid var(--amber);padding:12px 14px;font-size:15px;line-height:1.5;display:none}
#desk .dinfo.on{display:block;animation:pop .15s}
#desk .dinfo h3{margin:0 0 6px;font-family:var(--f-pix);font-size:9px;color:var(--amber);line-height:1.5}
#desk .dinfo .row{margin-top:10px}

/* ---------- computer ---------- */
#comp{position:fixed;inset:0;z-index:36;background:#040405;display:flex;align-items:center;justify-content:center;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.monitor{width:min(1060px,100%);height:min(720px,100%);background:linear-gradient(#d6cfbb,#bdb59f);border-radius:20px;padding:20px 20px 34px;position:relative;
  box-shadow:inset 0 -6px 0 #9b937e,inset 0 2px 0 #ece6d6,0 20px 60px #000;display:flex}
.monitor .brand{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-family:var(--f-pix);font-size:7px;color:#6b6553;letter-spacing:2px}
.monitor .led{position:absolute;bottom:12px;right:26px;width:7px;height:7px;border-radius:50%;background:#3f6;box-shadow:0 0 6px #3f6}
.screen{flex:1;background:#060a08;border-radius:12px;position:relative;overflow:hidden;box-shadow:inset 0 0 50px rgba(0,0,0,.95);color:var(--scr,#7cf0a4);
  font-family:var(--f-mono);font-size:14px;display:flex;flex-direction:column;min-width:0}
.screen::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,rgba(255,255,255,.04),transparent 70%);z-index:5}
.screen .bar{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid color-mix(in srgb,var(--scr) 35%,transparent);font-size:12px;flex:none}
.screen .bar .sp{flex:1}
.screen .bar button{background:none;border:1px solid color-mix(in srgb,var(--scr) 50%,transparent);color:var(--scr);padding:4px 9px;cursor:pointer;font-size:12px}
.screen .bar button:hover{background:color-mix(in srgb,var(--scr) 20%,transparent)}
.screen .area{flex:1;position:relative;overflow:auto;padding:14px;min-height:0;touch-action:pan-y}
.lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;text-align:center;padding:6px 0}
.lock .avatar{width:84px;height:84px;image-rendering:pixelated;border:2px solid var(--scr)}
.lock .u{font-family:var(--f-pix);font-size:11px;letter-spacing:2px}
.lock input{background:#000;border:1px solid var(--scr);color:var(--scr);padding:10px 12px;width:min(280px,70vw);text-align:center;font-size:16px;outline:none}
.lock .err{color:#ff6b6b;min-height:1.2em;font-size:13px}
.lock .hint{font-size:12px;opacity:.6}
.keypad{display:grid;grid-template-columns:repeat(3,58px);gap:8px}
.keypad button,.dpad button,.pkey{background:#000;border:1px solid var(--scr);color:var(--scr);height:50px;cursor:pointer;font-family:var(--f-pix);font-size:12px}
.keypad button:active,.dpad button:active{background:color-mix(in srgb,var(--scr) 30%,transparent)}
.pinview{font-family:var(--f-pix);font-size:20px;letter-spacing:12px;min-height:28px}
.dpad{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.seqview{font-family:var(--f-pix);font-size:14px;letter-spacing:4px;min-height:22px}
.piano{display:flex;gap:3px;position:relative}
.pkey{width:40px;height:120px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:8px;background:#e9e4d8;color:#222;border-color:#000}
.pkey.dn{background:var(--scr);color:#000}

<script>
/* ---- 10_core ---- */
'use strict';
/* =====================================================================
   MR. RUBEN — подарочная детективная игра.
   Структура файла:
   10 core    — утилиты, состояния (Episode/Character/Evidence/Inventory/
                Time/Dialogue/Puzzle/Save), ввод, звук
   20 art     — процедурный пиксель-арт: шрифт, персонажи, предметы
   30 data    — персонажи, улики, предметы, диалоги, столы, компьютеры, эпизоды
   40 world   — локации, карты, движение, взаимодействия, освещение
   50 ui      — HUD, диалоги, мысли, панели, стол, компьютер, телефон, мини-игры
   60 scenes  — катсцены, переходы эпизодов, финал
   70 main    — главное меню, игровой цикл
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wait = ms => new Promise(r => setTimeout(r, ms));
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (IS_TOUCH) document.body.classList.add('touch');
const tmin = s => { if (!s) return 9999; const [a, b] = s.split(':').map(Number); return (a < 6 ? a + 24 : a) * 60 + b; };

/* ---------------- Settings ---------------- */
const Settings = {
  music: 0.55, sfx: 0.8, crt: true, textSpeed: 2,
  load() { try { Object.assign(this, JSON.parse(store.get('mrruben_settings') || '{}')); } catch (e) { } this.apply(); },
  save() { store.set('mrruben_settings', JSON.stringify({ music: this.music, sfx: this.sfx, crt: this.crt, textSpeed: this.textSpeed })); this.apply(); },
  apply() { document.body.classList.toggle('nocrt', !this.crt); if (typeof SND !== 'undefined') SND.applyVol(); },
};

/* ---------------- Game state ----------------
   Всё, что сохраняется, лежит в одном объекте G.s.
   Менеджеры ниже — единственные точки изменения. */
const G = { s: null, paused: false, mode: 'menu' };
function freshState() {
  return {
    v: 3,
    episode: 1, maxEpisode: 1,
    phase: 'day',            // TimeState: 'day' | 'night'
    clock: '07:10',          // отображаемое время
    loc: 'apt', px: 150, py: 0, dir: 'right',
    flags: {},               // сюжетные флаги
    inv: [], easter: [],     // InventoryState
    suspects: {},            // CharacterState: id -> {added, talked:{}}
    evidence: [], evNew: [], // EvidenceState
    comps: {},               // PuzzleState: компьютеры, открытые файлы
    puzzles: {},             // решённые мини-игры
    seen: {},                // DialogueState: просмотренные реплики/выборы
    deskSeen: {},            // осмотренные предметы на столах
    phoneNew: [],            // непрочитанные чаты
    luxUntil: 0,
  };
}

const Flags = {
  has: f => !!G.s.flags[f],
  set(f, v = true) { if (G.s.flags[f] === v) return; G.s.flags[f] = v; Game.onChange(); },
  all: (...fs) => fs.every(f => G.s.flags[f]),
};

const Ev = { // EvidenceState
  has: id => G.s.evidence.includes(id),
  add(id, quiet) {
    if (!EVIDENCE[id]) { console.warn('no evidence', id); return false; }
    if (Ev.has(id)) return false;
    G.s.evidence.push(id); G.s.evNew.push(id);
    const e = EVIDENCE[id];
    if (e.who && CHARS[e.who] && !Sus.has(e.who) && e.who !== 'varya' && e.who !== 'ruben') Sus.add(e.who, true);
    if (!quiet) { UI.toast('НОВАЯ УЛИКА', e.title, 'ev'); SND.sfx('evidence'); UI.markBtn('inv2', true); }
    Game.onChange();
    return true;
  },
  of: who => G.s.evidence.filter(id => EVIDENCE[id].who === who),
  count: ids => ids.filter(Ev.has).length,
};

const Inv = { // InventoryState
  has: id => G.s.inv.includes(id) || G.s.easter.includes(id),
  add(id, quiet) {
    const it = ITEMS[id]; if (!it || Inv.has(id)) return false;
    (it.kind === 'easter' ? G.s.easter : G.s.inv).push(id);
    if (!quiet) { UI.toast(it.kind === 'easter' ? 'ПАСХАЛКА' : 'ПРЕДМЕТ', it.name); SND.sfx(it.kind === 'easter' ? 'easter' : 'pickup'); UI.markBtn('inv', true); }
    Game.onChange(); return true;
  },
};

const Sus = { // CharacterState
  has: id => !!(G.s.suspects[id] && G.s.suspects[id].added),
  add(id, quiet) {
    if (Sus.has(id)) return;
    G.s.suspects[id] = Object.assign(G.s.suspects[id] || {}, { added: true });
    Flags.set(id + '_added');
    if (!quiet) { UI.toast('ПАПКА ПОДОЗРЕВАЕМЫХ', CHARS[id].name + ' добавлен(а) в дело'); SND.sfx('paper'); UI.markBtn('sus', true); }
    Game.onChange();
  },
  // Статус вычисляется по найденным уликам — не «виновен/невиновен».
  statuses(id) {
    const set = new Set();
    for (const eid of Ev.of(id)) { const st = EVIDENCE[eid].status; if (st) set.add(st); }
    if (!set.size) set.add('unknown');
    return ['refuted', 'contradiction', 'confirmed', 'varya', 'unknown'].filter(s => set.has(s));
  },
};
const STATUS = {
  confirmed: ['ПОДТВЕРЖДЕНО', '🟢', 'Информация совпадает с независимым источником.'],
  contradiction: ['ЕСТЬ ПРОТИВОРЕЧИЕ', '🟡', 'Часть рассказа не совпадает с найденными данными.'],
  refuted: ['АЛИБИ ОПРОВЕРГНУТО', '🔴', 'Есть объективное доказательство, что человек был в другом месте.'],
  unknown: ['НЕИЗВЕСТНО', '❓', 'Пока недостаточно информации.'],
  varya: ['СВЯЗАНО С ВАРЕЙ', '🔵', 'Найдена связь с Варей, но значение пока неизвестно.'],
};

const Puzzle = { // PuzzleState
  solved: id => !!G.s.puzzles[id],
  solve(id) { if (G.s.puzzles[id]) return; G.s.puzzles[id] = true; Game.onChange(); },
  compOpen: id => !!(G.s.comps[id] && G.s.comps[id].unlocked),
  unlockComp(id) { G.s.comps[id] = Object.assign(G.s.comps[id] || {}, { unlocked: true }); Flags.set(id + '_computer_unlocked'); },
};

const Time = { // TimeState
  isNight: () => G.s.phase === 'night',
  set(phase, clock) { G.s.phase = phase; if (clock) G.s.clock = clock; Game.onChange(); },
  date: () => (EPISODES[G.s.episode] || {}).date || '',
};

const Save = {
  KEY: 'mrruben_save_v3',
  exists: () => !!store.get(Save.KEY),
  write() {
    if (!G.s || G.mode === 'menu' || G.noSave) return;
    if (World.player) { G.s.px = Math.round(World.player.x); G.s.py = Math.round(World.player.y); G.s.dir = World.player.dir; }

function talkScript(id) {
  if (id === 'mark' && !Flags.has('mark_interrogated')) return MARK_EP1;
  if (FIRST_TALK[id] && !Flags.has(id + '_talked1')) return FIRST_TALK[id];
  const extra = (TALK_EXTRA[id] ? TALK_EXTRA[id]() : []).filter(Boolean);
  if (extra.length) return extra[0];
  const pool = FLAVOR[id] || ['…'];
  G.s.seen['fl_' + id] = ((G.s.seen['fl_' + id] || 0) + 1);
  return [{ s: id, t: pool[G.s.seen['fl_' + id] % pool.length] }];
}

function deskBase(c, cfg) {
  const wall = cfg.wall || '#2a2e38';
  R(c, 0, 0, DW, DESK_Y, wall);
  speck(c, 0, 0, DW, DESK_Y, [shade(wall, 0.05), shade(wall, -0.07)], 0.25, cfg.seed || 3);
  if (cfg.wallFn) cfg.wallFn(c);
  // столешница в перспективе
  const top = cfg.wood || '#6b4a33';
  for (let y = DESK_Y; y < DH; y++) {
    const t = (y - DESK_Y) / (DH - DESK_Y), x0 = lerp(14, -30, t), x1 = lerp(DW - 14, DW + 30, t);
    R(c, x0, y, x1 - x0, 1, shade(top, -0.18 + t * 0.22));
    if (cfg.grain !== false && (y * 7) % 11 === 0) R(c, x0 + ((y * 37) % 80), y, 40 + (y * 13) % 60, 1, shade(top, -0.28 + t * 0.2));
  }
  R(c, 14, DESK_Y, DW - 28, 1, shade(top, 0.3));
  R(c, 0, DESK_Y - 4, DW, 4, 'rgba(0,0,0,.35)');
}
function deskLight(c, cfg) {
  // ночное освещение крупного плана
  const [lc, lx] = mk(DW, DH);
  lx.fillStyle = 'rgba(4,6,12,0.62)'; lx.fillRect(0, 0, DW, DH);
  lx.globalCompositeOperation = 'destination-out';
  for (const L of (cfg.lights || [[160, 110, 150]])) { const g = lx.createRadialGradient(L[0], L[1], 0, L[0], L[1], L[2]); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.6, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); lx.fillStyle = g; lx.fillRect(0, 0, DW, DH); }
  c.drawImage(lc, 0, 0);
  for (const L of (cfg.glows || [])) glow(c, L[0], L[1], L[2], L[3], L[4] || 0.25);
}

let _last = performance.now();
function loop(now) {
