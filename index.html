<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A Dream of a Dream — A Journey to Dream</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060d;color:#ece9f5;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:#05060d}
#canvasWrap{position:absolute;inset:0;transition:filter .6s}
#app.vnmode #canvasWrap{filter:blur(2px) brightness(.6)}
#canvasWrap.dreamblur{filter:blur(8px) saturate(2.2) brightness(1.2);transition:filter 1.4s}
#gameCanvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;transition:filter 1.2s}
.layer{position:absolute;inset:0}
.hidden{display:none!important}
#fxLayer{pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#grain{pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grain .5s steps(4) infinite}
body.lowfx #grain{display:none}
@keyframes grain{0%{background-position:0 0}25%{background-position:-37px 21px}50%{background-position:19px -43px}75%{background-position:-11px 33px}}
#lbTop,#lbBot{position:absolute;left:0;right:0;height:0;background:#000;z-index:5;transition:height .5s ease;pointer-events:none}
#lbTop{top:0}#lbBot{bottom:0}
#app.vnmode #lbTop,#app.vnmode #lbBot{height:4.5vh}
/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hudTop{position:absolute;left:10px;top:10px;max-width:60%;background:linear-gradient(135deg,rgba(14,12,34,.82),rgba(8,10,24,.66));border:1px solid rgba(255,255,255,.12);border-left:3px solid #ffd27a;border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px)}
#locName{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#a9a4d6}
#objective{font-size:13px;margin-top:3px;color:#fff}
#objective::before{content:"◆ ";color:#ffd27a}
#hudBtns{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:auto}
#hudBtns button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(8,10,24,.72);color:#fff;font-size:18px}
#hudBtns button:active{background:rgba(120,110,200,.7)}
#prompt{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:rgba(8,10,24,.82);border:1px solid rgba(255,210,122,.4);color:#ffe6b0;padding:6px 14px;border-radius:20px;font-size:13px;white-space:nowrap;box-shadow:0 0 18px rgba(255,210,122,.18)}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-6px);background:rgba(20,14,40,.92);border:1px solid rgba(185,165,255,.35);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .4s,transform .4s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- MOBILE ---------- */
#mobile{position:absolute;inset:0;pointer-events:none}
#joystick{position:absolute;left:14px;bottom:16px;width:132px;height:132px;border-radius:50%;pointer-events:auto;touch-action:none;background:radial-gradient(circle at 35% 30%,rgba(135,118,210,.48),rgba(20,22,40,.58) 65%);border:1px solid rgba(224,213,255,.28);box-shadow:inset 0 0 24px rgba(15,8,38,.7),0 5px 20px rgba(0,0,0,.22)}
#joystick:before,#joystick:after{content:"";position:absolute;background:rgba(235,225,255,.14);left:50%;top:50%;transform:translate(-50%,-50%)}
#joystick:before{width:1px;height:70%}#joystick:after{width:70%;height:1px}
#joyThumb{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;border:2px solid rgba(255,230,165,.58);background:radial-gradient(circle at 35% 28%,#a98df0,#49378a);box-shadow:0 4px 14px rgba(13,7,32,.62);transition:transform .05s linear;pointer-events:none}
#joystick.active #joyThumb{border-color:#ffe09b;background:radial-gradient(circle at 35% 28%,#c1abff,#5a43a2)}
#actBtns{position:absolute;right:16px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
#btnA{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,210,122,.55);background:radial-gradient(circle at 35% 30%,#8a6fd8,#3a2b7a);color:#fff;font-size:22px;font-weight:700;box-shadow:0 4px 18px rgba(120,90,255,.35);touch-action:none}
#btnA:active{transform:scale(.94)}
body.noTouch #mobile{display:none}
/* ---------- VISUAL NOVEL ---------- */
#vn{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 10px 14px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 50%);z-index:6}
#portraitWrap{position:relative;width:min(290px,42vh);height:min(320px,46vh);margin-bottom:-26px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.65));animation:pop .3s ease-out;z-index:0;pointer-events:none}
#portraitWrap svg{width:100%;height:100%;overflow:visible}
#portraitWrap::after{content:"";position:absolute;left:10%;right:10%;bottom:6%;height:30%;background:radial-gradient(ellipse at center,var(--pglow,rgba(160,130,255,.35)),transparent 70%);z-index:-1;filter:blur(10px)}
#portraitWrap.shake{animation:shake .45s}
#portraitWrap.nm svg{filter:hue-rotate(-28deg) saturate(1.35) contrast(1.12)}
#portraitWrap.dr svg{filter:saturate(1.18) brightness(1.04)}
#portraitWrap.vd svg{filter:grayscale(.25) brightness(1.08)}
#portraitWrap svg .breath{animation:breath 3.6s ease-in-out infinite;transform-box:view-box;transform-origin:100px 230px}
@keyframes breath{50%{transform:scale(1.01,1.018)}}
#portraitWrap svg .eyes{animation:blink 4.3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
#portraitWrap svg .mt{opacity:0}
#portraitWrap.talk svg .mo{animation:mo .24s steps(1) infinite}
#portraitWrap.talk svg .mt{animation:mt .24s steps(1) infinite}
#portraitWrap.talk svg .head{animation:talk .3s ease-in-out infinite alternate;transform-box:view-box;transform-origin:100px 160px}
@keyframes mo{0%{opacity:1}50%{opacity:0}}
@keyframes mt{0%{opacity:0}50%{opacity:1}}
@keyframes talk{to{transform:translateY(-1.3px) rotate(-.5deg)}}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{15%{transform:translateX(-7px) rotate(-1deg)}35%{transform:translateX(6px) rotate(1deg)}55%{transform:translateX(-4px)}75%{transform:translateX(3px)}}
#dlgBox{position:relative;z-index:1;width:min(780px,100%);min-height:118px;background:linear-gradient(180deg,rgba(22,18,48,.95),rgba(10,8,24,.96));border:1px solid rgba(190,170,255,.35);border-radius:14px;padding:20px 20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
#dlgBox::before{content:"";position:absolute;inset:0;border-radius:14px;padding:1px;background:linear-gradient(120deg,var(--nc,#6a54c8),transparent 40%,transparent 60%,rgba(255,210,122,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#dlgName{position:absolute;z-index:2;top:-15px;left:16px;background:linear-gradient(90deg,#6a54c8,#3a2b7a);padding:3px 14px;border-radius:8px;font-size:13px;letter-spacing:1px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#dlgText{font-size:15px;line-height:1.55;min-height:46px}
#dlgText.thought{font-style:italic;color:#c9c2ea}
#dlgText.narr{font-style:italic;color:#d9d3f0;text-align:center}
#dlgNext{position:absolute;right:14px;bottom:8px;font-size:12px;color:#ffd27a;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#choices button{background:rgba(90,70,170,.35);border:1px solid rgba(185,165,255,.55);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;text-align:left;transition:.15s}
#choices button:hover,#choices button:active{background:rgba(120,100,220,.6);box-shadow:0 0 16px rgba(160,130,255,.35);transform:translateX(3px)}
/* ---------- TITLE ---------- */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#0a0720,#1a1040 55%,#2a1a50);overflow:hidden;text-align:center}
#titleSky{position:absolute;left:0;bottom:0;width:100%;height:100%;image-rendering:pixelated}
#title h1{font-size:clamp(26px,7vw,64px);letter-spacing:6px;font-weight:300;text-shadow:0 0 30px #9f8cff,0 0 60px #5a3fd8;animation:glow 4s ease-in-out infinite;z-index:2;padding:0 10px}
@keyframes glow{50%{text-shadow:0 0 40px #c9bcff,0 0 90px #7a5ff8}}
#title .sub{margin-top:8px;letter-spacing:5px;font-size:clamp(11px,2vw,15px);color:#b9a9ff;text-transform:uppercase;z-index:2}
#title .city{margin-top:6px;font-size:11px;letter-spacing:6px;color:#ffd27a;z-index:2;opacity:.85}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:30px;width:min(300px,80vw);z-index:2}
.menu button,.panelBox button{padding:12px 16px;border-radius:12px;border:1px solid rgba(190,170,255,.4);background:rgba(30,22,70,.75);color:#fff;font-size:15px;letter-spacing:1px;transition:.2s;backdrop-filter:blur(3px)}
.menu button:hover,.panelBox button:hover{background:rgba(110,90,220,.6);transform:translateY(-1px);box-shadow:0 0 18px rgba(150,120,255,.3)}
.menu button:disabled{opacity:.4;transform:none;cursor:default;box-shadow:none}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(200,180,255,.8),rgba(120,90,255,0));animation:float linear infinite;pointer-events:none;bottom:-10vh;z-index:1}
@keyframes float{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}to{transform:translateY(-120vh) scale(1.3);opacity:0}}
#titleFoot{position:absolute;bottom:12px;font-size:11px;color:#9f97c8;letter-spacing:1px;padding:0 10px;z-index:2}
#progressInfo{margin-top:16px;font-size:12px;color:#b3a9dd;z-index:2;min-height:16px}
.episodeSelect{display:flex;flex-direction:column;gap:8px}
.episodeBtn{display:grid!important;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;text-align:left!important;padding:11px 12px!important}
.episodeBtn b{font-size:12px;color:#ffd27a;letter-spacing:1px}.episodeBtn span{font-size:14px}.episodeBtn span i{display:block;font-style:normal;font-size:10px;color:#a9a4d6;letter-spacing:1px;margin-top:2px}.episodeBtn small{font-size:10px;color:#a9a4d6;letter-spacing:1px;text-transform:uppercase}
.episodeBtn.locked{opacity:.45;filter:saturate(.4)}.episodeBtn.completed small{color:#8fd694}.episodeBtn.current{border-color:rgba(255,210,122,.75);background:rgba(100,80,190,.4)}
/* ---------- PANEL ---------- */
#panel{display:flex;align-items:center;justify-content:center;background:rgba(3,2,10,.7);backdrop-filter:blur(3px);z-index:20}
.panelBox{width:min(440px,92vw);max-height:88vh;overflow:auto;background:linear-gradient(160deg,#1b1640,#0c0a20);border:1px solid rgba(190,170,255,.35);border-radius:16px;padding:20px}
.panelBox h2{font-weight:400;letter-spacing:3px;font-size:16px;text-transform:uppercase;color:#c9bcff;margin-bottom:14px;text-align:center}
.panelBox .list{display:flex;flex-direction:column;gap:8px}
.q{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05);font-size:14px}
.q.done{color:#8fd694;text-decoration:line-through;opacity:.7}
.q.cur{border:1px solid rgba(255,210,122,.4);color:#fff}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.inv button{aspect-ratio:1;font-size:26px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.inv button small{font-size:10px;letter-spacing:0;margin-top:4px;opacity:.85;text-align:center}
.inv button.sel{border-color:#ffd27a;background:rgba(120,100,220,.5)}
#invDesc{margin-top:12px;font-size:13px;color:#d9d3f0;min-height:40px;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.row button{padding:8px 14px;font-size:13px;min-width:110px}
.empty{color:#8f86b8;font-size:13px;text-align:center;padding:10px}
/* ---------- CARD (episode intro) ---------- */
#card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(40,26,90,.92),rgba(3,2,10,.97) 70%);z-index:30;opacity:0;transition:opacity .8s;padding:20px}
#card.show{opacity:1}
#card .n{font-size:12px;letter-spacing:8px;color:#ffd27a;text-transform:uppercase}
#card .t{font-size:clamp(30px,8vw,64px);font-weight:200;letter-spacing:8px;margin:10px 0;text-shadow:0 0 30px rgba(160,130,255,.8)}
#card .d{font-size:12px;letter-spacing:4px;color:#b9a9ff;text-transform:uppercase}
#card .l{margin-top:18px;font-size:15px;font-style:italic;color:#e0daf5;max-width:520px;line-height:1.5}
#card .s{margin-top:26px;font-size:11px;color:#7f77a8;letter-spacing:2px}
#card.show .t{animation:cardIn 1.6s ease-out}
@keyframes cardIn{from{letter-spacing:22px;opacity:0;filter:blur(8px)}to{letter-spacing:8px;opacity:1;filter:none}}
/* ---------- ENDING ---------- */
#ending{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1d1745,#050411 70%);text-align:center;padding:20px;overflow:auto;z-index:25}
#ending.white{background:radial-gradient(ellipse at 50% 40%,#ffffff,#e9e6f2 70%);color:#2a2440}
#ending.white h1{color:#5a4a9a}#ending.white p{color:#3a3450}#ending.white h2{color:#b0801a}
#ending .box{max-width:580px}
#ending h1{font-weight:300;letter-spacing:5px;font-size:clamp(18px,4vw,30px);color:#c9bcff}
#ending h2{font-weight:400;font-size:clamp(16px,3.5vw,22px);margin:14px 0;color:#ffd27a}
#ending p{font-size:14px;line-height:1.6;color:#d9d3f0;margin-bottom:10px}
#ending .next{font-size:12px;color:#8f86b8;margin:14px 0;line-height:1.6}
/* ---------- FADE ---------- */
#fade{background:#000;opacity:0;transition:opacity .5s;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40;overflow:hidden}
#fade.dreamy{background:radial-gradient(circle at 50% 50%,#3b2a7a,#0b0620 70%)}
#fade.dreamy::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,#3b2a7a,#9f7bff,#ffb8e6,#6ad0ff,#3b2a7a);animation:spin 5s linear infinite;opacity:.55;filter:blur(40px)}
@keyframes spin{to{transform:rotate(360deg)}}
#fadeText{position:relative;font-size:clamp(16px,3vw,24px);letter-spacing:4px;color:#f1ecff;font-style:italic;opacity:.95;text-align:center;padding:0 20px;text-shadow:0 0 18px rgba(0,0,0,.6)}
#fade.white #fadeText{color:#3a3450;text-shadow:none}
@media (max-width:600px){#dlgText{font-size:14px}#portraitWrap{width:170px;height:190px;margin-bottom:-24px}#joystick{width:112px;height:112px;bottom:13px;left:12px}#joyThumb{width:52px;height:52px;margin:-26px}#btnA{width:64px;height:64px}#prompt{bottom:100px;font-size:12px}#hudTop{max-width:58%;padding:6px 10px}#objective{font-size:12px}#hudBtns button{width:36px;height:36px;font-size:16px}}
@media (max-height:420px){#portraitWrap{width:150px;height:165px;margin-bottom:-20px}#dlgBox{min-height:92px;padding:16px 16px 18px}}
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap"><canvas id="gameCanvas" width="480" height="320"></canvas></div>
  <div id="fxLayer" class="layer"></div>
  <div id="grain" class="layer"></div>
  <div id="lbTop"></div><div id="lbBot"></div>

  <div id="hud" class="layer hidden">
    <div id="hudTop"><div id="locName">Улица</div><div id="objective">…</div></div>
    <div id="hudBtns">
      <button data-panel="quest" title="Задания (Q)">📜</button>
      <button data-panel="inv" title="Инвентарь (I)">🎒</button>
      <button data-panel="menu" title="Меню (Esc)">☰</button>
    </div>
    <div id="prompt" class="hidden"></div>
    <div id="mobile">
      <div id="joystick" aria-label="Виртуальный джойстик"><div id="joyThumb"></div></div>
      <div id="actBtns"><button id="btnA">E</button></div>
    </div>
  </div>

  <div id="vn" class="layer hidden">
    <div id="portraitWrap"></div>
    <div id="dlgBox">
      <div id="dlgName"></div>
      <div id="dlgText"></div>
      <div id="dlgNext" class="hidden">▼</div>
      <div id="choices" class="hidden"></div>
    </div>
  </div>

  <div id="title" class="layer">
    <canvas id="titleSky"></canvas>
    <div id="orbs"></div>
    <h1>A DREAM OF A DREAM</h1>
    <div class="sub">A Journey to Dream</div>
    <div class="city">NEW YORK CITY</div>
    <div class="menu">
      <button id="btnNew">Новая игра</button>
      <button id="btnContinue">Продолжить</button>
      <button id="btnEpisodes">Эпизоды</button>
      <button id="btnSettings">Настройки</button>
    </div>
    <div id="progressInfo"></div>
    <div id="titleFoot">Семь желаний · один сон &nbsp;·&nbsp; WASD / стрелки — движение · E / Space — действие · Esc — меню</div>
  </div>

  <div id="card" class="layer hidden"><div class="n"></div><div class="t"></div><div class="d"></div><div class="l"></div><div class="s">нажмите, чтобы продолжить</div></div>

  <div id="ending" class="layer hidden">
    <div class="box">
      <h1 id="endTitle"></h1>
      <h2 id="endName"></h2>
      <div id="endText"></div>
      <div class="next" id="endNext"></div>
      <div class="menu" style="margin:10px auto 0"><button id="btnEndMenu">В главное меню</button><button id="btnEndTitle" class="hidden">В главное меню</button></div>
    </div>
  </div>

  <div id="panel" class="layer hidden"><div class="panelBox"><h2 id="panelTitle"></h2><div id="panelBody"></div></div></div>
  <div id="fade" class="layer hidden"><div id="fadeText"></div></div>
  <div id="toast"></div>
</div>

<script>
'use strict';
// ============================================================
// CONFIG
// ============================================================
const TILE = 32;
const CFG = {
  baseH: 320, minW: 288, maxW: 640,
  playerSpeed: 105, npcSpeed: 40, textSpeed: 26,
  saveKey: 'dod_save_v2', progressKey: 'dod_progress_v1', settingsKey: 'dod_settings_v2'
};
const $ = s => document.querySelector(s);
// Storage with in-memory fallback: the game keeps working when localStorage is blocked
// (file:// on phones, private mode, full quota) — progress then lives for the session.
const Store = {
  mem: {},
  get(k) { if (k in this.mem) return this.mem[k]; try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { this.mem[k] = null; try { localStorage.removeItem(k); } catch (e) {} }
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const app = $('#app'), canvas = $('#gameCanvas'), ctx2d = canvas.getContext('2d'), canvasWrap = $('#canvasWrap');
const lightCanvas = document.createElement('canvas'), lctx = lightCanvas.getContext('2d');
const bufCanvas = document.createElement('canvas'), bctx = bufCanvas.getContext('2d');
function rnd(seed) { let s = Math.abs(Math.floor(seed)) % 233280; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function hashXY(x, y) { return ((x * 73856093) ^ (y * 19349663)) >>> 0; }
function hashStr(t) { let h = 7; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 100000; return h; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1, 7), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// ============================================================
// GAME STATE
// ============================================================
function freshState() {
  return {
    mode: 'title', episode: 'pride', step: 0, map: 'street', time: 'day',
    flags: {}, choices: {}, inventory: ['phone', 'key'],
    nightmareOn: false, nightmare: 0, endingType: null
  };
}
let state = freshState();
const settings = { sound: true, music: true, voices: true, touch: null, fastText: false, lowFx: false };
const player = { x: 0, y: 0, dir: 'down', moving: false, anim: 0, stepT: 0 };
const view = { w: 480, h: 320, scale: 1 };
const cam = { x: 0, y: 0, init: false, shake: 0 };
const keys = { up: false, down: false, left: false, right: false };
const touchMove = { x: 0, y: 0, active: false };
let world = null, particles = [], gameTime = 0, pendingEpisodeTimer = null;

// ============================================================

function episodeSceneMaps() {
  const all = {};
  Object.entries(EP_MAPS).forEach(([id, M]) => {
    const d = EP_DATA[id], R = M.real, door = R.door;
    const routeObj = R.routeSubway ? { x: 16, y: 6, w: 2, h: 2 } : { x: door, y: 4, w: 2, h: 2 };
    const routeExit = R.routeSubway ? { x: 16, y: 6, w: 2, h: 1 } : { x: door, y: 5, w: 2, h: 1 };
    const back = R.routeSubway ? { tx: 15, ty: 6, dir: 'left' } : { tx: door + 1, ty: 6.2, dir: 'down' };
    d.backSpawn = back;
    const objs = [{ ...routeObj, id: 'episode_route', label: d.routeLabel }];
    if (R.clue) objs.push({ ...R.clue, id: 'episode_clue' });
    const npcs = [{ id: 'episode_client', char: d.char, tx: 12, ty: 8, dir: 'left', cond: s => s.episode === id && s.step <= 5, quest: [0, 5] }];
    if (R.clueNpc) npcs.push({ id: 'episode_clue', char: R.clueNpc.char, tx: R.clueNpc.tx, ty: R.clueNpc.ty, dir: 'down', label: R.clueNpc.label, cond: s => s.step <= 2, quest: [1] });
    if (R.walker) npcs.push({ id: 'walker', char: R.walker, tx: 5, ty: 6, route: [[5, 6], [15, 6], [15, 9], [8, 9]], wait: 1.5 });
    (R.extra || []).forEach(e => npcs.push(e));
    all[d.realMap] = nycStreet(Object.assign({}, R, { objects: objs, npcs, exits: [{ ...routeExit, to: d.sleepMap, spawn: M.sleep.spawn || { tx: 3, ty: 10, dir: 'right' }, cond: s => s.episode === id && s.step >= 6 }] }));

    const S = M.sleep, sp = S.sleepPos;
    const doorPos = S.door || { x: 2, y: 11 };
    all[d.sleepMap] = interior(Object.assign({}, S, {
      objects: [{ x: doorPos.x, y: doorPos.y, w: 1, h: 1, id: 'episode_return', label: 'Выйти на улицу' }],
      npcs: [{ id: 'episode_client', char: d.char, tx: sp[0], ty: sp[1], dir: 'left', cond: s => s.episode === id && (s.step === 6 || s.step === 12), quest: [6, 12], sleeping: s => !!s.flags.clientAsleep }, ...(S.extra || [])],
      exits: [{ x: doorPos.x, y: doorPos.y, w: 1, h: 1, to: d.realMap, spawn: back, cond: s => s.step !== 12 }],
      lights: [{ tx: 8, ty: 4, r: 160, c: '255,220,170' }, { tx: 4, ty: 8, r: 110, c: '255,210,160' }]
    }));

    const gate = { x: 14, y: 10, w: 2, h: 1, id: 'episode_dream_gate', label: 'Сияющая дверь', prop: 'door_glow' };
    const dreamNpcs = [{ id: 'episode_client', char: d.char, tx: 8, ty: 6, dir: 'down', cond: s => s.episode === id && s.step === 7, quest: [7] }];
    if (M.dreamStreet) {
      const DS = M.dreamStreet;
      all[d.dreamMap] = nycStreet(Object.assign({}, DS, { dream: true, truck: false, bg: '#210f3e', spawn: { tx: 3, ty: 10, dir: 'right' }, objects: [{ ...gate, y: 10 }], npcs: [...dreamNpcs.map(n => ({ ...n, ty: 7 })), ...(DS.extra || [])] }));
    } else {
      const D = M.dream;
      all[d.dreamMap] = dreamRoom(Object.assign({}, D, { theme: 'dream_' + id, objects: [gate], npcs: [...dreamNpcs, ...(D.extra || [])], lights: [{ tx: 9, ty: 4, r: 170, c: '255,230,200' }] }));
    }
    const X = M.side;
    all[d.sideMap] = dreamRoom(Object.assign({}, X, {
      theme: 'night_' + id,
      objects: [
        { x: 3, y: 8, w: 2, h: 1, id: 'episode_evidence_1', label: X.ev1.label, prop: X.ev1.prop },
        { x: 13, y: 8, w: 2, h: 1, id: 'episode_evidence_2', label: X.ev2.label, prop: X.ev2.prop },

      ],

      lights: [{ tx: 9, ty: 5, r: 170, c: '255,210,230' }]
    }));
  });
  return all;

// ============================================================
const actorRect = (x, y) => ({ x: x - 7, y: y - 8, w: 14, h: 8 });
function isSolid(tx, ty) {
  const row = world.tiles[ty]; if (!row) return true;
  const ch = row[tx]; if (ch === undefined) return true;

}

  const x0 = Math.floor(r.x / TILE), x1 = Math.floor((r.x + r.w - 1) / TILE), y0 = Math.floor(r.y / TILE), y1 = Math.floor((r.y + r.h - 1) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty)) return true;
  if (!ignoreNpc) for (const n of world.npcs) if (n.visible && !n.lying && !n.ghost && rectsOverlap(r, actorRect(n.x, n.y))) return true;

// PLAYER
// ============================================================
function updatePlayer(dt) {
  let dx = touchMove.x, dy = touchMove.y;
  if (keys.left) dx -= 1; if (keys.right) dx += 1; if (keys.up) dy -= 1; if (keys.down) dy += 1;
  const rawLen = Math.hypot(dx, dy);
  if (rawLen > 1) { dx /= rawLen; dy /= rawLen; }
  player.moving = !!(dx || dy) && !player.hidden;
  if (!player.moving) { player.anim = 0; player.stepT = 0.2; return; }
  if (Math.abs(dx) >= Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left'; else player.dir = dy > 0 ? 'down' : 'up';
  const sp = CFG.playerSpeed * dt * Math.min(1, rawLen || 1);
  const mx = sp * dx, my = sp * dy;
  if (!collides(player.x + mx, player.y)) player.x += mx;
  if (!collides(player.x, player.y + my)) player.y += my;

  player.stepT += dt;
  if (player.stepT > 0.32) { player.stepT = 0; Audio.sfx('step'); }
}
function checkExits() {

    const rx = e.x * TILE, ry = e.y * TILE, rw = e.w * TILE, rh = e.h * TILE;
    if (player.x >= rx && player.x < rx + rw && player.y >= ry && player.y < ry + rh) { goTo(e.to, e.spawn); return; }

}
function findTarget() {

  const px = player.x, py = player.y - 4, d = player.dir;
  const ax = px + (d === 'left' ? -16 : d === 'right' ? 16 : 0), ay = py + (d === 'up' ? -16 : d === 'down' ? 16 : 0);
  let best = null, bd = 1e9;
  for (const n of world.npcs) {
    if (!n.visible || n.noTalk) continue;
    const nx = n.x, ny = n.y - 6;
    const dist = Math.min(Math.hypot(nx - ax, ny - ay), Math.hypot(nx - px, ny - py) + 8);
    if (dist < 30 && dist < bd) { bd = dist; best = { kind: 'npc', id: n.id, ref: n, label: n.label || CHARS[charOf(n)].name }; }
  }
  for (const o of world.objects) {
    if (o.cond && !o.cond(state)) continue;

    const cx = clamp(ax, rx, rx + rw), cy = clamp(ay, ry, ry + rh);

    const dist = Math.min(Math.hypot(cx - ax, cy - ay), Math.hypot(cx2 - px, cy2 - py) + 8);

  }

}
function facePlayerToward(x, y) {
  const dx = x - player.x, dy = y - player.y;

}

// ============================================================
// NPC
// ============================================================
function faceToward(n, tx, ty) {

}

const CHASE_LINES = ['«Не уходи»', '«Ты же хотел, чтобы я была рядом»', '«Навсегда. Как ты мечтал»', '«Куда ты? Я с тобой»'];

      n.cool = 1.8; Audio.sfx('heartbeat'); cam.shake = 0.35; showToast(CHASE_LINES[Math.floor(Math.random() * CHASE_LINES.length)]);
      const px = player.x + dx / (d || 1) * 30, py = player.y + dy / (d || 1) * 30;

    }
    return;
  }
  if (state.mode === 'world' && n.chase && state.nightmareOn) {
    const dx = player.x - n.x, dy = player.y - n.y, d = Math.hypot(dx, dy);

  }

  if (state.episode === 'protagonist' && state.step === 6) return base + ' (' + Object.keys(state.flags.finalSeen || {}).length + '/7)';
  if (state.episode === 'protagonist' && state.step === 11) return base + ' (' + Object.keys(state.flags.epSeen || {}).length + '/6)';
  if (EP_DATA[state.episode] && state.step === 8) return base + ' (' + (state.flags.evidence || 0) + '/2)';
  return base;
}
function setStep(n) {
  if (n <= state.step) return;
  state.step = n;
  const q = questSteps();
  if (n < q.length) { Audio.sfx('quest'); showToast('Задание: ' + q[n]); }
  updateHUD();
  saveGame(true);
}
function locationName() {
  if (!world) return '';
  if (state.flags.voidOn) return 'Белая пустота';
  if (world.def.dream) return state.nightmareOn ? 'Кошмар · ' + EPISODES[state.episode].title : (world.def.name.startsWith('Сон') ? world.def.name : 'Сон · ' + world.def.name);
  const t = state.time === 'evening' ? ' · вечер' : state.time === 'night' || world.def.night ? ' · ночь' : '';

function updateHUD() { $('#locName').textContent = world ? locationName() : ''; $('#objective').textContent = objectiveText(); }

const hasItem = id => state.inventory.includes(id);

function saveGame(auto) {
  if (state.mode === 'title' || state.mode === 'ending' || !world) return;
  if (state.flags.voidOn || player.hidden) return;
  try {
    const data = { v: 2, state: Object.assign({}, state, { mode: undefined }), player: { x: player.x, y: player.y, dir: player.dir }, ts: Date.now() };
    Store.set(CFG.saveKey, JSON.stringify(data));

  } catch (e) { if (!auto) showToast('Не удалось сохранить'); }
}
function hasSave() { try { return !!Store.get(CFG.saveKey); } catch (e) { return false; } }
function loadGame() {
  try {
    const d = JSON.parse(Store.get(CFG.saveKey)); if (!d || !d.state || d.v !== 2) return false;
    state = Object.assign(freshState(), d.state);
    state.mode = 'world';
    if (!MAPS[state.map] || !EPISODES[state.episode]) return false;

}
function loadSettings() { try { Object.assign(settings, JSON.parse(Store.get(CFG.settingsKey)) || {}); } catch (e) {} }

  const ep = EPISODES[id], el = $('#card');
  el.querySelector('.n').textContent = id === 'protagonist' ? 'Серия 8 · финал' : 'Серия ' + ep.num;
  el.querySelector('.t').textContent = ep.title;
  el.querySelector('.d').textContent = 'Нью-Йорк · ' + ep.district;
  el.querySelector('.l').textContent = ep.logline;
  el.classList.remove('hidden'); void el.offsetWidth; el.classList.add('show');
  Audio.sfx('open');
  let done = false;
  const finish = () => { if (done) return; done = true; el.classList.remove('show'); el.onclick = null; setTimeout(() => { el.classList.add('hidden'); cb(); }, 700); };
  el.onclick = finish; setTimeout(finish, 4200);
}
function resetView() { $('#title').classList.add('hidden'); $('#ending').classList.add('hidden'); $('#hud').classList.remove('hidden'); }
function startEpisode(id) {
  clearTimeout(pendingEpisodeTimer);
  state = freshState(); state.episode = id; state.mode = 'transition';
  $('#title').classList.add('hidden'); $('#ending').classList.add('hidden');
  Audio.music('title');
  showCard(id, () => {
    resetView(); player.anim = 0; particles = [];
    if (id === 'pride') { player.dir = 'left'; loadMap('street'); state.mode = 'world'; Audio.music('day'); startDialog('intro'); }
    else if (id === 'protagonist') { state.map = 'hospital'; state.time = 'night'; state.inventory = ['phone', 'key', 'sauce']; loadMap('hospital'); state.mode = 'world'; Audio.music('hospital'); startDialog({ lines: FINAL.start }); }
    else {
      const d = EP_DATA[id];
      state.map = d.realMap; state.time = 'day'; state.inventory = ['phone', 'key', 'sauce']; state.flags = { evidence: 0 };
      player.dir = 'right'; loadMap(d.realMap); state.mode = 'world'; Audio.music('day');
      startDialog({ lines: d.intro });
    }
    updateHUD(); saveGame(true);
  });
}
function startNewGame() { startEpisode('pride'); }
let endNextEpisode = null;
function completeEpisode(id) {
  const d = EP_DATA[id], choice = state.choices[id + '_choice'] || 'free';
  const p = episodeProgress(); p[id] = true; p.endings[id] = d.endName; p.control = p.control || {}; p.control[id] = choice === 'control';
  try { Store.set(CFG.progressKey, JSON.stringify(p)); Store.remove(CFG.saveKey); } catch (e) {}
  state.endingType = choice; state.mode = 'transition';
  const ep = EPISODES[id], next = EPISODE_ORDER[EPISODE_ORDER.indexOf(id) + 1];
  endNextEpisode = next || null;
  Fx.fade({ dur: 1100, hold: 400, mid: () => {
    $('#endTitle').textContent = `Серия ${ep.num} · ${ep.title}`;
    $('#endName').textContent = '«' + d.endName + '»';
    $('#endText').innerHTML = `<p>${d.endCommon}</p><p>${choice === 'control' ? d.endCtrl : d.endFree}</p><p><i>${choice === 'control' ? 'Вы решили за клиента.' : 'Вы позволили клиенту решить самому.'}</i></p>`;
    $('#endNext').textContent = next ? `Далее: Серия ${EPISODES[next].num} · ${EPISODES[next].title}` : '';
    $('#btnEndMenu').textContent = next ? 'Следующая серия ▶' : 'В главное меню';
    $('#btnEndTitle').classList.toggle('hidden', !next);
    $('#ending').classList.remove('white');
    $('#hud').classList.add('hidden'); $('#ending').classList.remove('hidden'); Audio.music('title'); Audio.ambience('none');
  }, after: () => { state.mode = 'ending'; } });
}
function finalTheEnd() {
  endNextEpisode = null;
  const p = episodeProgress(); p.protagonist = true; p.endings.protagonist = 'Старый рецепт';
  try { Store.set(CFG.progressKey, JSON.stringify(p)); Store.remove(CFG.saveKey); } catch (e) {}
  state.mode = 'transition';
  Fx.fade({ color: '#fff', dur: 1800, hold: 700, mid: () => {
    $('#ending').classList.add('white');
    $('#endTitle').textContent = 'A DREAM OF A DREAM'; $('#endName').textContent = 'Конец';
    $('#endText').innerHTML = '<p>Не бойся своих желаний, если они не причиняют вреда другим.</p><p>Но и не бойся позволить другому ошибиться — даже если тебе кажется, что ты знаешь, как лучше.</p>';
    $('#endNext').textContent = 'Спасибо за путешествие в сон.';
    $('#btnEndMenu').textContent = 'В главное меню'; $('#btnEndTitle').classList.add('hidden');
    $('#hud').classList.add('hidden'); $('#ending').classList.remove('hidden'); Audio.music('void'); Audio.ambience('none');
  }, after: () => { state.mode = 'ending'; } });
}

// ---------- generic episode flow (2–7) ----------
function currentEpisodeData() { return EP_DATA[state.episode] && EP_DATA[state.episode].realMap ? EP_DATA[state.episode] : null; }
function kitchenForEpisode(part) {
  const d = currentEpisodeData(); if (!d) return;
  if (part === 'fridge') {
    if (state.step === 2) startDialog({ lines: [N('В холодильнике всё для простого горячего сендвича.'), { s: 'hero', e: 'normal', t: 'Возьму свежие продукты.', give: 'ingredients' }], after: () => setStep(3) });
    else if (state.step < 2) say([H('think', '(Сначала нужно понять, для кого я готовлю.)')]);
    else say([N('Холодильник гудит, как всегда.')]);
  } else if (part === 'counter') {
    if (state.step === 3) startDialog({ lines: [N('Хлеб, начинка, тепло гриля. Руки действуют привычно.', 'sfx:eat'), { s: 'hero', e: 'normal', t: 'Обычный сендвич готов.', take: 'ingredients', give: 'sandwich' }], after: () => setStep(4) });
    else if (state.step < 3) say([H('normal', 'Сначала продукты из холодильника.')]);
    else say([N('На столе лежит сендвич. Он ждёт одного решения.')]);
  } else if (part === 'shelf') {
    if (state.step === 4) startDialog({ lines: [H('think', '(Особый соус. Я уже знаю, что он делает. И всё равно беру бутылку.)'), { s: 'hero', e: 'normal', t: 'Добавить особый соус?', choices: [
      { t: 'Добавить несколько капель.', set: s => { s.flags.sauceAdded = true; }, lines: [{ s: 'narr', t: 'Золотые искры растворяются в хлебе.', take: 'sandwich', give: 'sandwich_special', fx: 'sfx:drip' }, H('smug', 'Я покажу, к чему ведёт это желание. А потом помогу проснуться.')] },
      { t: 'Пока не добавлять.', lines: [H('think', '(Ещё можно передумать.)')] }
    ] }], after: s => { if (s.flags.sauceAdded) setStep(5); } });
    else say([N('Тёмная бутылка стоит на полке. От неё трудно отвести взгляд.')]);
  }
}
function beginEpisodeDream() {
  const d = currentEpisodeData(); if (!d) return;
  state.mode = 'transition';
  Fx.dream(() => { state.time = 'dream'; state.nightmareOn = false; state.nightmare = 0; state.flags.evidence = 0; loadMap(d.dreamMap); setStep(7); Audio.music(musicFor()); },
    () => { state.mode = 'world'; startDialog({ lines: [N('Сон собрался вокруг чужого желания. Впереди уже ждёт его хозяин.'), H('think', '(Надо найти клиента и понять, что именно исполнил соус.)')] }); }, '…сон · ' + EPISODES[state.episode].title.toLowerCase() + '…');
}
function enterEpisodeNightmare() {
  const d = currentEpisodeData(); if (!d) return;
  state.nightmareOn = true; state.nightmare = 0.12; Audio.music('nightmare'); Audio.ambience(ambienceFor()); Audio.sfx('alarm'); Fx.flash('#f4b6cf', 220); setStep(9);
  startDialog({ lines: d.nightmare });
}
function chooseEpisodeOutcome() {
  const d = currentEpisodeData(); if (!d) return;
  if (state.step < 10) { say([N('Сначала найди его. Он где-то рядом.')]); return; }
  if (state.step > 10) { say([N('Выбор уже сделан.')]); return; }
  startDialog({ lines: [{ s: 'hero', e: 'normal', t: d.choicePrompt, choices: [
    { t: d.choiceA, set: s => { s.choices[s.episode + '_choice'] = 'control'; }, lines: d.resultA },
    { t: d.choiceB, set: s => { s.choices[s.episode + '_choice'] = 'free'; }, lines: d.resultB }
  ] }, ...d.climax], after: () => { state.flags.exitOpen = true; Audio.sfx('open'); setStep(11); showToast(state.episode === 'lust' ? 'Край крыши светится' : 'В темноте открылся выход'); } });
}
function wakeEpisodeClient() {
  const d = currentEpisodeData(); if (!d) return;
  state.mode = 'transition';
  Fx.wake(() => { state.nightmareOn = false; state.nightmare = 0; state.time = d.wakeTime; state.flags.exitOpen = false; state.flags.clientAsleep = false; const sp = MAPS[d.sleepMap].spawn; loadMap(d.sleepMap, { tx: sp.tx + 3, ty: sp.ty, dir: 'right' }); setStep(12); Audio.music(musicFor()); },
    () => { state.mode = 'world'; startDialog({ lines: d.wake, after: () => completeEpisode(state.episode) }); }, d.wakeText);
}
function genericClient(t, npc) {
  const d = currentEpisodeData(); if (!d) return;
  if (state.map === d.realMap) {
    if (state.step === 0) startDialog({ lines: d.meet, after: () => setStep(1) }, { npc });
    else if (state.step === 1) say(d.hint, npc);
    else if (state.step >= 2 && state.step < 5) say([C(d.char, 'normal', 'Ты вроде хотел приготовить сендвич? Фургон у тротуара.'), H('normal', 'Скоро вернусь.')], npc);
    else if (state.step === 5) startDialog({ lines: [...d.handoff, { s: 'narr', t: 'Особый сендвич исчезает в его руках.', take: 'sandwich_special' }], after: () => { setStep(6); showToast(d.routeLabel + ' — вход подсвечен'); } }, { npc });
  } else if (state.map === d.sleepMap) {
    if (state.step === 6) startDialog({ lines: d.sleep, after: () => { state.flags.clientAsleep = true; beginEpisodeDream(); } }, { npc });
    else say([C(d.char, 'normal', '…')], npc);
  } else if (state.map === d.dreamMap && state.step === 7) startDialog({ lines: d.dream, after: () => { setStep(8); showToast('Сияющая дверь ведёт дальше'); } }, { npc });
}
function genericEvidence(t) {
  const d = currentEpisodeData(); if (!d) return;
  if (state.step !== 8) { say([N(state.step < 8 ? 'Это часть красивой, но чужой декорации.' : 'Ты уже видел это. От этого не становится легче.')]); return; }
  const num = t.id.endsWith('_1') ? 0 : 1, key = 'evidence' + num;
  if (state.flags[key]) { say([N('Ты уже видел это. От этого не становится легче.')]); return; }
  state.flags[key] = true; state.flags.evidence = (state.flags.evidence || 0) + 1;
  startDialog({ lines: d.evidence[num], after: () => { updateHUD(); if (state.flags.evidence >= 2) enterEpisodeNightmare(); } });
}
function episodeRoute() {
  const d = currentEpisodeData(); if (!d) return;
  if (state.step < 6) say([H('normal', 'Сначала надо закончить работу в фургоне.')]);
  else goTo(d.sleepMap, MAPS[d.sleepMap].spawn);
}
function episodeDreamGate() {
  const d = currentEpisodeData(); if (!d) return;
  if (state.step < 8) say([N('За этой дверью ещё слишком светло. Сначала стоит поговорить с ним.')]);
  else { Audio.sfx('dream'); goTo(d.sideMap, MAPS[d.sideMap].spawn); }
}
function musicFor() {
  if (!world) return 'title';
  if (state.flags.voidOn) return 'void';
  if (world.def.dream) { if (state.nightmareOn) return 'nightmare'; if (world.id === 'dream' || world.id === 'wrath_dream_arena') return 'stage'; return 'dream'; }
  if (world.def.music) return world.def.music;
  return state.time === 'evening' || state.time === 'night' ? 'evening' : 'day';
}
function goTo(mapId, spawn, mid) {
  if (state.mode === 'transition') return;
  state.mode = 'transition'; Audio.sfx('door');
  for (const k in keys) keys[k] = false;
  Fx.fade({ dur: 350, hold: 100, mid: () => { loadMap(mapId, spawn); if (mid) mid(); Audio.music(musicFor()); }, after: () => { state.mode = 'world'; saveGame(true); if (TRIGGERS[mapId]) TRIGGERS[mapId](); } });
}

const INTERACTIONS = {
  truck() {
    if (state.episode === 'pride') goTo('truck', MAPS.truck.spawn, () => { if (state.step === 0) setStep(1); });
    else { state.flags.returnMap = state.map; goTo('truck', MAPS.truck.spawn); }
  },
  truck_door() {
    if (state.episode === 'pride') { goTo('street', { tx: 4, ty: 13.2, dir: 'down' }); return; }
    const d = currentEpisodeData(); goTo(state.flags.returnMap || d.realMap, { tx: 6, ty: 10.4, dir: 'right' });
  },
  fridge() {
    if (state.episode !== 'pride') { kitchenForEpisode('fridge'); return; }
    if (state.step === 3) startDialog('fridgeTake');
    else if (state.step < 3) say([N('Холодильник гудит. Внутри всё на месте.'), H('think', '(Пока нечего готовить. Сначала клиент.)')]);
    else if (state.step === 4 || state.step === 5) say([N('Продукты уже на столе.'), H('normal', 'Сначала доделаю сендвич.')]);
    else say([N('Холодильник. Гудит, как всегда.')]);
  },
  counter() {
    if (state.episode !== 'pride') { kitchenForEpisode('counter'); return; }
    if (state.step === 4) startDialog('counterMake');
    else if (state.step === 3) say([H('normal', 'Сначала продукты. Холодильник слева.')]);
    else if (state.step === 5) say([N('Сендвич лежит на столе. Не хватает одной детали.'), H('think', '(Соус на полке.)')]);
    else say([N('Рабочий стол. Чистый, как учил наставник.')]);
  },
  shelf() {
    if (state.episode !== 'pride') { kitchenForEpisode('shelf'); return; }
    if (state.step <= 1) startDialog('mentorNote');
    else if (state.step === 5) startDialog('sauceChoice');
    else if (state.step < 5) say([N('Бутылка стоит на своём месте и ждёт.'), H('think', '(Сначала сендвич.)')]);
    else say([N('Бутылка стоит на своём месте. Стала будто чуть легче.')]);
  },
  stove() { say([N('Гриль. Ещё тёплый после вчерашнего.'), H('normal', 'Надо бы почистить. Потом.')]); },
  trash_street() { say([N('Урна. Сверху — вчерашняя газета: «Метро снова опаздывает».'), H('think', '(Когда-нибудь всё лишнее отправляется сюда.)')]); },
  trash_park() { say([N('Урна. Внутри — обёртка от сендвича. С моим логотипом.')]); },
  bench_street() { say([N('Скамейка. Кто-то нацарапал: «ЗДЕСЬ ИГРАЛА ЛЕГЕНДА». Ниже другим почерком: «нет».')]); },
  bench_park() { say([N(state.step >= 11 ? 'Скамейка. Здесь старый гитарист проспал полдня.' : 'Старая скамейка. Ещё хранит утреннее тепло.')]); },
  door_house() { say([N('Дверь подъезда. Заперто. На звонке двадцать фамилий и ни одной знакомой.')]); },
  door_pizza() { say([N('Пиццерия. Кусок за доллар — легенда, которая пережила три повышения цен.'), H('smug', '(Мои сендвичи всё равно лучше.)')]); },
  door_laundry() { say([N('Прачечная. Машины крутятся, люди смотрят на них, как в телевизор.')]); },
  door_deli() { say([N('Дели «24/7». Кот спит на мешках с рисом. Классика Нью-Йорка.')]); },

  fountain() { say([N('Фонтан. На дне — монетки. Чужие желания.'), H('think', '(Люди бросают желания в воду и уходят. А я хочу их исполнять.)')]); },
  arch() { say([N('Арка на Вашингтон-сквер. Под ней играют джаз, жонглируют и делают предложения руки и сердца.')]); },
  chess() { say([N('Каменные шахматные столы. Здесь проигрывают быстро и без обид.')]); },
  poster() {
    if (state.nightmareOn) say([N('Плакат: «ЛЕГЕНДА? ★ ФАЛЬШИВКА». Кто-то пририсовал ему рога.'), H('scared', 'Утром здесь было написано другое.')]);

    else say([N('Зеркало. В отражении — владелец фургона… но толпа за его спиной смотрит не на него.'), H('think', '(Это не мой сон. Я здесь только зритель.)')]);
  },
  statue() { say([N(state.nightmareOn ? 'Статуя треснула пополам. Табличка: «Кто?»' : 'Золотая статуя: старик с гитарой. Табличка: «Лучший. Всегда».')]); },

  },
  pride_park(t, npc) {
    if (state.step === 7) startDialog('pridePark', { npc });
    else if (state.step === 11) startDialog('endingPark', { npc });
  },
  pride_dream(t, npc) { if (state.step === 8) startDialog('prideDream', { npc }); },
  pride_hidden(t, npc) { if (state.step === 9) startDialog('prideHidden', { npc }); else say([D('normal', 'Дверь там, внизу. Иди — я за тобой.')], npc); },
  neighbor(t, npc) {
    if (state.step < 2) say([C('neighbor', 'happy', 'Привет, шеф! Сегодня без сендвича — пробежка. Завтра точно!'), H('normal', 'Беги. Завтра сделаю двойной.')], npc);
    else if (state.step < 7) say([C('neighbor', 'smug', 'Беги-беги, у тебя там клиент с гитарой скучает.')], npc);
    else say([C('neighbor', 'happy', 'Видела, как твой гитарист в парк побежал. Счастливый такой.')], npc);
  },
  ped_a(t, npc) { say([C('ped1', 'normal', 'Извините, не могу говорить — у меня созвон через четыре минуты и такси через три.')], npc); },
  ped_b(t, npc) { say([C('ped2', 'happy', 'Вы не подскажете, где тут Вашингтон-сквер? Ой, вижу. Спасибо!')], npc); },
  oldman(t, npc) {
    if (state.step === 7) say([C('oldman', 'normal', 'Твой гитарист на лавочке жуёт так, будто неделю не ел.'), H('normal', 'Мой.')], npc);
    else if (state.step >= 11) say([C('oldman', 'smug', 'Проснулись, голубчики? Я уж думал, вас тут до утра оставить. Мат в три хода, кстати.')], npc);

  },
  fan(t, npc) {
    const i = { fan1: 0, fan2: 1, fan3: 2 }[t.id] || 0;
    const v = state.nightmareOn ? [
      [C('papa', 'smug', 'Вы его друг? Правда, что он украл свою главную песню? Комментарий! КОММЕНТАРИЙ!', 'flash sfx:flash'), H('angry', 'Отстаньте.')],
      [C('papa', 'normal', 'Снимаю. Всё снимаю. Каждое слово пойдёт в эфир.'), H('scared', '(Они не отстанут.)')],

  episode_evidence_1: genericEvidence,
  episode_evidence_2: genericEvidence,

// STATIC STORY AUDIT
// ============================================================
function runStoryAudit() {
  const issues = [], note = m => issues.push(m);
  Object.entries(MAPS).forEach(([id, m]) => {
    if (!m.tiles || !m.tiles.length) { note(`${id}: нет тайлов`); return; }
    const w = m.tiles[0].length;
    if (m.tiles.some(r => r.length !== w)) note(`${id}: строки разной длины`);
    m.tiles.forEach((r, y) => { for (const ch of r) if (!TILES[ch]) note(`${id}: неизвестный тайл «${ch}» в строке ${y}`); });
    const sx = Math.floor(m.spawn.tx), sy = Math.floor(m.spawn.ty + .75), tile = m.tiles[sy] && m.tiles[sy][sx];
    if (!tile || TILES[tile].solid) note(`${id}: точка входа в коллизии (${sx},${sy} = ${tile})`);
    for (const n of m.npcs || []) { const c = charOf(n); if (!CHARS[c]) note(`${id}: NPC ${n.id} → неизвестный персонаж ${c}`); }
    for (const e of m.exits || []) { if (!MAPS[e.to]) note(`${id}: переход в несуществующую карту ${e.to}`); else { const s = e.spawn, t2 = MAPS[e.to].tiles[Math.floor(s.ty + .75)]?.[Math.floor(s.tx)]; if (!t2 || TILES[t2].solid) note(`${id} → ${e.to}: точка появления в коллизии (${s.tx},${s.ty})`); } }
    for (const o of m.objects || []) if (!INTERACTIONS[o.id]) note(`${id}: объект ${o.id} без обработчика`);
  });
  EPISODE_ORDER.forEach(id => { if (!EPISODES[id] || !EPISODES[id].steps.length) note(`${id}: нет этапов`); });
  Object.entries(EP_DATA).forEach(([id, d]) => { if (!d.realMap) return; ['meet', 'hint', 'clue', 'handoff', 'sleep', 'dream', 'nightmare', 'nightTalk', 'resultA', 'resultB', 'climax', 'portal', 'wake'].forEach(k => { if (!d[k] || !d[k].length) note(`${id}: нет текста ${k}`); }); });
  const names = /(Тим|Даня|Дани|Гер[аы]|Марин|Паш)/;
  const scan = l => { if (l && l.t && names.test(l.t)) note('Имя в реплике: ' + l.t); if (l && l.choices) l.choices.forEach(c => (c.lines || []).forEach(scan)); };
  Object.values(DIALOGS).forEach(d => d.lines.forEach(scan));
  Object.values(EP_DATA).forEach(d => Object.values(d).forEach(v => Array.isArray(v) && v.flat().forEach(scan)));
  Object.values(FINAL).forEach(v => (typeof v === 'function' ? v() : v).forEach(scan));
  if (issues.length) console.warn('[A Dream of a Dream] Проверка контента:', issues);
  else console.info('[A Dream of a Dream] Проверка контента: все карты, переходы и реплики согласованы.');
  return { ok: !issues.length, issues };
}
window.runDreamAudit = runStoryAudit;
window.addEventListener('resize', resize);
loadSettings(); applyTouch(); applyFx(); resize(); refreshTitle(); runStoryAudit(); Audio.music('title');
requestAnimationFrame(loop);
</script>
