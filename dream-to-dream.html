*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060d;color:#ece9f5;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:#05060d}
#canvasWrap{position:absolute;inset:0;transition:filter .6s}
#app.vnmode #canvasWrap{filter:blur(2px) brightness(.6)}
#canvasWrap.dreamblur{filter:blur(8px) saturate(2.2) brightness(1.2);transition:filter 1.4s}
#gameCanvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;transition:filter 1.2s}
.layer{position:absolute;inset:0}
.hidden{display:none!important}
#fxLayer{pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#grain{pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grain .5s steps(4) infinite}
body.lowfx #grain{display:none}
@keyframes grain{0%{background-position:0 0}25%{background-position:-37px 21px}50%{background-position:19px -43px}75%{background-position:-11px 33px}}
#lbTop,#lbBot{position:absolute;left:0;right:0;height:0;background:#000;z-index:5;transition:height .5s ease;pointer-events:none}
#lbTop{top:0}#lbBot{bottom:0}
#app.vnmode #lbTop,#app.vnmode #lbBot{height:4.5vh}
/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hudTop{position:absolute;left:10px;top:10px;max-width:60%;background:linear-gradient(135deg,rgba(14,12,34,.82),rgba(8,10,24,.66));border:1px solid rgba(255,255,255,.12);border-left:3px solid #ffd27a;border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px)}
#locName{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#a9a4d6}
#objective{font-size:13px;margin-top:3px;color:#fff}
#objective::before{content:"◆ ";color:#ffd27a}
#hudBtns{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:auto}
#hudBtns button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(8,10,24,.72);color:#fff;font-size:18px}
#hudBtns button:active{background:rgba(120,110,200,.7)}
#prompt{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:rgba(8,10,24,.82);border:1px solid rgba(255,210,122,.4);color:#ffe6b0;padding:6px 14px;border-radius:20px;font-size:13px;white-space:nowrap;box-shadow:0 0 18px rgba(255,210,122,.18)}

<script>
'use strict';
// ============================================================
// CONFIG
// ============================================================
const TILE = 32;
const CFG = {
  baseH: 320, minW: 288, maxW: 640,
  playerSpeed: 105, npcSpeed: 40, textSpeed: 26,
  saveKey: 'dod_save_v2', progressKey: 'dod_progress_v1', settingsKey: 'dod_settings_v2'
};
const $ = s => document.querySelector(s);
// Storage with in-memory fallback: the game keeps working when localStorage is blocked
// (file:// on phones, private mode, full quota) — progress then lives for the session.
const Store = {
  mem: {},
  get(k) { if (k in this.mem) return this.mem[k]; try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { this.mem[k] = null; try { localStorage.removeItem(k); } catch (e) {} }
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const app = $('#app'), canvas = $('#gameCanvas'), ctx2d = canvas.getContext('2d'), canvasWrap = $('#canvasWrap');
const lightCanvas = document.createElement('canvas'), lctx = lightCanvas.getContext('2d');
const bufCanvas = document.createElement('canvas'), bctx = bufCanvas.getContext('2d');
function rnd(seed) { let s = Math.abs(Math.floor(seed)) % 233280; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function hashXY(x, y) { return ((x * 73856093) ^ (y * 19349663)) >>> 0; }
function hashStr(t) { let h = 7; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 100000; return h; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1, 7), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// ============================================================
// GAME STATE
// ============================================================
function freshState() {
  return {
    mode: 'title', episode: 'pride', step: 0, map: 'street', time: 'day',
    flags: {}, choices: {}, inventory: ['phone', 'key'],
    nightmareOn: false, nightmare: 0, endingType: null
  };
}
let state = freshState();
const settings = { sound: true, music: true, voices: true, touch: null, fastText: false, lowFx: false };
const player = { x: 0, y: 0, dir: 'down', moving: false, anim: 0, stepT: 0 };
const view = { w: 480, h: 320, scale: 1 };
const cam = { x: 0, y: 0, init: false, shake: 0 };
const keys = { up: false, down: false, left: false, right: false };
const touchMove = { x: 0, y: 0, active: false };
let world = null, particles = [], gameTime = 0, pendingEpisodeTimer = null;

// ============================================================
// CHARACTERS — no personal names: everyone is a role

const EVENTS = {

    state.flags.voidOn = true; state.flags.voidT = 0; world.voidWalk = true;

const TRIGGERS = {
  hospital() {
    if (state.episode === 'protagonist' && state.step === 1 && player.x > 15 * TILE && player.y > 6.5 * TILE && !state.flags.arrived) {
      state.flags.arrived = true; setStep(2);
      for (const n of world.npcs) { n.visible = !n.cond || n.cond(state); }
      startDialog({ lines: FINAL.arrival, after: () => showToast('Зал ожидания — дверь слева') });

  },
  hospital_wait() { if (state.episode === 'protagonist' && state.step === 2) setStep(3); }

function showCard(id, cb) {
  const ep = EPISODES[id], el = $('#card');
  el.querySelector('.n').textContent = id === 'protagonist' ? 'Серия 8 · финал' : 'Серия ' + ep.num;
  el.querySelector('.t').textContent = ep.title;
  el.querySelector('.d').textContent = 'Нью-Йорк · ' + ep.district;
  el.querySelector('.l').textContent = ep.logline;
  el.classList.remove('hidden'); void el.offsetWidth; el.classList.add('show');
  Audio.sfx('open');
  let done = false;
  const finish = () => { if (done) return; done = true; el.classList.remove('show'); el.onclick = null; setTimeout(() => { el.classList.add('hidden'); cb(); }, 700); };
  el.onclick = finish; setTimeout(finish, 4200);
}
function resetView() { $('#title').classList.add('hidden'); $('#ending').classList.add('hidden'); $('#hud').classList.remove('hidden'); }
function startEpisode(id) {
  clearTimeout(pendingEpisodeTimer);
  state = freshState(); state.episode = id; state.mode = 'transition';
  $('#title').classList.add('hidden'); $('#ending').classList.add('hidden');
  Audio.music('title');
  showCard(id, () => {
    resetView(); player.anim = 0; particles = [];
    runToken++; forceWalk = null; cam.follow = null;
    if (id === 'protagonist') { state.map = 'hospital'; state.time = 'night'; state.inventory = ['phone', 'key', 'sauce']; loadMap('hospital'); state.mode = 'world'; Audio.music('hospital'); startDialog({ lines: FINAL.start }); }
    else { state.inventory = id === 'pride' ? ['phone', 'key'] : ['phone', 'key', 'sauce']; EPS[id].start(); }
    updateHUD(); saveGame(true);
  });
}
function startNewGame() { startEpisode('pride'); }
let endNextEpisode = null;
function completeEpisode(id) {
  const d = EPS[id].end, choice = state.choices[id + '_choice'] || 'free';
  const p = episodeProgress(); p[id] = true; p.endings[id] = d.name; p.control = p.control || {}; p.control[id] = choice === 'control';
  try { Store.set(CFG.progressKey, JSON.stringify(p)); Store.remove(CFG.saveKey); } catch (e) {}
  state.endingType = choice; state.mode = 'transition';
  const ep = EPISODES[id], next = EPISODE_ORDER[EPISODE_ORDER.indexOf(id) + 1];
  endNextEpisode = next || null;
  Fx.fade({ dur: 1100, hold: 400, mid: () => {
    $('#endTitle').textContent = `Серия ${ep.num} · ${ep.title}`;
    $('#endName').textContent = '«' + d.name + '»';
    $('#endText').innerHTML = `<p>${d.common}</p><p>${choice === 'control' ? d.ctrl : d.free}</p><p><i>${choice === 'control' ? 'Вы решили за клиента.' : 'Вы позволили клиенту решить самому.'}</i></p>`;
    $('#endNext').textContent = next ? `Далее: Серия ${EPISODES[next].num} · ${EPISODES[next].title}` : '';
    $('#btnEndMenu').textContent = next ? 'Следующая серия ▶' : 'В главное меню';
    $('#btnEndTitle').classList.toggle('hidden', !next);
    $('#ending').classList.remove('white');
    $('#hud').classList.add('hidden'); $('#ending').classList.remove('hidden'); Audio.music('title'); Audio.ambience('none');
    state.flags.playAs = null;
  }, after: () => { state.mode = 'ending'; } });
}
function finalTheEnd() {
  endNextEpisode = null;
  const p = episodeProgress(); p.protagonist = true; p.endings.protagonist = 'Старый рецепт';
  try { Store.set(CFG.progressKey, JSON.stringify(p)); Store.remove(CFG.saveKey); } catch (e) {}
  state.mode = 'transition';
  Fx.fade({ color: '#fff', dur: 1800, hold: 700, mid: () => {
    $('#ending').classList.add('white');
    $('#endTitle').textContent = 'A DREAM OF A DREAM'; $('#endName').textContent = 'Конец';
    $('#endText').innerHTML = '<p>Не бойся своих желаний, если они не причиняют вреда другим.</p><p>Но и не бойся позволить другому ошибиться — даже если тебе кажется, что ты знаешь, как лучше.</p>';
    $('#endNext').textContent = 'Спасибо за путешествие в сон.';
    $('#btnEndMenu').textContent = 'В главное меню'; $('#btnEndTitle').classList.add('hidden');
    $('#hud').classList.add('hidden'); $('#ending').classList.remove('hidden'); Audio.music('void'); Audio.ambience('none');
  }, after: () => { state.mode = 'ending'; } });
}

function musicFor() {
  if (!world) return 'title';
  if (state.flags.voidOn) return 'void';
  if (world.def.dream) { if (state.nightmareOn) return 'nightmare'; return world.def.music || 'dream'; }
  if (world.def.music) return world.def.music;
  return state.time === 'evening' || state.time === 'night' ? 'evening' : 'day';
}
function goTo(mapId, spawn, mid) {
  if (state.mode === 'transition') return;
  state.mode = 'transition'; Audio.sfx('door');
  for (const k in keys) keys[k] = false;
  Fx.fade({ dur: 350, hold: 100, mid: () => { loadMap(mapId, spawn); if (mid) mid(); Audio.music(musicFor()); }, after: () => { state.mode = 'world'; saveGame(true); if (TRIGGERS[mapId]) TRIGGERS[mapId](); } });
}

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };

window.addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.repeat) return;
  Audio.init(); Audio.resume();
  switch (e.code) {
    case 'KeyE': case 'Space': case 'Enter':

      if (state.mode === 'title' && e.code === 'Enter') { hasSave() ? continueGame() : startNewGame(); }

    case 'Escape': if (state.mode === 'menu') closePanel(); else togglePanel('menu'); break;
    case 'KeyI': togglePanel('inv'); break;
    case 'KeyQ': case 'KeyJ': togglePanel('quest'); break;
    case 'Digit1': case 'Digit2': case 'Digit3':

});

const joystickEl = $('#joystick'), joyThumbEl = $('#joyThumb');
let joystickPointer = null;
function resetJoystick() {
  touchMove.x = 0; touchMove.y = 0; touchMove.active = false; joystickPointer = null;
  joystickEl.classList.remove('active'); joyThumbEl.style.transform = '';
}
function moveJoystick(e) {
  const r = joystickEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const max = Math.min(r.width, r.height) * 0.28;
  let x = e.clientX - cx, y = e.clientY - cy, len = Math.hypot(x, y);
  if (len > max) { x = x / len * max; y = y / len * max; len = max; }
  touchMove.x = x / max; touchMove.y = y / max; touchMove.active = len > 2;
  joyThumbEl.style.transform = `translate(${x}px,${y}px)`;
}

const titleSky = $('#titleSky'), tctx = titleSky.getContext('2d');
function resizeTitleSky() { titleSky.width = Math.max(200, Math.floor(app.clientWidth / 2)); titleSky.height = Math.max(150, Math.floor(app.clientHeight / 2)); }

// Title: a layered New York in soft dusk — far planes pale and hazy, near planes dark, fog and clouds between
const TitleCity = {
  LAYERS: [
    { c: '#d9cfda', hmin: .2, hmax: .46, sp: 1.5, win: 0, spire: .35 },
    { c: '#c3b4c6', hmin: .16, hmax: .38, sp: 3, win: .25, spire: .25 },
    { c: '#9e8ca6', hmin: .13, hmax: .31, sp: 6, win: .45, spire: .15 },
    { c: '#6a5776', hmin: .1, hmax: .24, sp: 10, win: .7, spire: .1 },
    { c: '#3a2b45', hmin: .05, hmax: .15, sp: 16, win: .85, spire: 0, roofs: true }
  ],
  cache: null, key: '',
  build(h) {
    const W0 = 900; this.cache = this.LAYERS.map((L, li) => {
      const cv = document.createElement('canvas'); cv.width = W0; cv.height = h; const g = cv.getContext('2d'), r = rnd(777 + li * 31); let x = -4;
      while (x < W0) {
        const bw = Math.round(10 + r() * 22), bh = Math.round(h * (L.hmin + r() * (L.hmax - L.hmin))), top = h - bh;
        g.fillStyle = L.c; g.fillRect(x, top, bw, bh);
        const kind = r();
        if (kind < L.spire) { g.fillRect(x + bw * .25, top - bh * .12, bw * .5, bh * .12); g.beginPath(); g.moveTo(x + bw * .3, top - bh * .12); g.lineTo(x + bw / 2, top - bh * .3); g.lineTo(x + bw * .7, top - bh * .12); g.fill(); g.fillRect(x + bw / 2 - .5, top - bh * .4, 1, bh * .12); }
        else if (kind < .45) { g.fillRect(x + 2, top - 5, bw - 4, 5); g.fillRect(x + 4, top - 9, bw - 8, 4); }
        else if (kind < .55 && L.roofs) { g.fillRect(x + 3, top - 9, 7, 6); g.fillRect(x + 4, top - 3, 1, 3); g.fillRect(x + 8, top - 3, 1, 3); g.beginPath(); g.moveTo(x + 2, top - 9); g.lineTo(x + 6.5, top - 13); g.lineTo(x + 11, top - 9); g.fill(); }
        else if (kind < .62) { g.fillRect(x + bw / 2, top - 12, 1, 12); }
        if (L.win) for (let wy = top + 3; wy < h - 2; wy += 4) for (let wx = x + 2; wx < x + bw - 2; wx += 3) if (r() < .32) { g.fillStyle = `rgba(255,${214 + Math.floor(r() * 30)},${140 + Math.floor(r() * 60)},${L.win * (.4 + r() * .6)})`; g.fillRect(wx, wy, 1, 2); }
        x += bw + (r() < .3 ? 2 : 0);
      }
      return cv;
    });
  },
  draw(g, w, h, t) {
    const key = h; if (!this.cache || this.key !== key) { this.build(h); this.key = key; }
    const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#f6efe8'); sky.addColorStop(.45, '#f0e2e2'); sky.addColorStop(.75, '#e2d0dc'); sky.addColorStop(1, '#d4c2d6');
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    const cloud = (cx, cy, s, a) => { g.fillStyle = `rgba(255,255,255,${a})`; for (const [dx, dy, rr] of [[0, 0, 1], [-1.1, .25, .75], [1.1, .3, .8], [-.5, -.45, .7], [.55, -.4, .75], [2, .4, .55], [-2, .45, .5]]) { g.beginPath(); g.arc(cx + dx * s, cy + dy * s, rr * s, 0, 7); g.fill(); } };
    for (let i = 0; i < 4; i++) cloud(((i * 260 + t * 4) % (w + 200)) - 100, h * (.12 + (i % 2) * .08), 9 + i % 3 * 3, .55);
    this.cache.forEach((cv, i) => {
      const L = this.LAYERS[i], off = (t * L.sp) % cv.width, yo = Math.round(h * .04 * (4 - i) * .25);
      for (let x = -off; x < w; x += cv.width) g.drawImage(cv, Math.floor(x), yo);
      const fog = g.createLinearGradient(0, h, 0, h * .55); fog.addColorStop(0, `rgba(250,240,242,${.34 - i * .05})`); fog.addColorStop(1, 'rgba(250,240,242,0)'); g.fillStyle = fog; g.fillRect(0, 0, w, h);
      if (i === 2) for (let k = 0; k < 3; k++) cloud(((k * 330 + t * 9 + 120) % (w + 240)) - 120, h * .62 + k * 6, 7, .38);
    });
    for (let i = 0; i < 9; i++) cloud(((i * 70 + t * 6) % (w + 140)) - 70, h - 4 + Math.sin(t * .5 + i) * 2, 12 + (i % 3) * 4, .92);
  }
};
function refreshTitle() {

}

(function makeOrbs() {

  for (let i = 0; i < 16; i++) {
    const o = document.createElement('div'); o.className = 'orb'; const s = 6 + Math.random() * 26;

(function makeGrain() {
  try { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), d = g.createImageData(128, 128); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`; } catch (e) {}
})();

// ============================================================
// GAME LOOP
// ============================================================
const promptEl = $('#prompt'), btnAEl = $('#btnA');
let lastPrompt = null, lastBtnA = '', lastJoystick = null;
function updatePrompt() {
  const t = state.mode === 'world' ? findTarget() : null;
  const txt = t ? '[E] ' + t.label : null;
  if (txt !== lastPrompt) { lastPrompt = txt; if (txt) { promptEl.textContent = txt; promptEl.classList.remove('hidden'); } else promptEl.classList.add('hidden'); }
  const a = state.mode === 'dialogue' ? '▶' : 'E';
  if (a !== lastBtnA) { lastBtnA = a; btnAEl.textContent = a; }
  const showJoystick = state.mode === 'world' || !!state.flags.countdown;
  if (showJoystick !== lastJoystick) { lastJoystick = showJoystick; joystickEl.style.visibility = showJoystick ? '' : 'hidden'; if (!showJoystick) resetJoystick(); }
}
function updateVoid(dt) {
  if (!state.flags.voidOn || state.flags.voidT >= 1) return;
  state.flags.voidT = Math.min(1, state.flags.voidT + dt / 6);
  for (let i = 0; i < 6; i++) particles.push({ type: 'evap', x: cam.x + Math.random() * view.w, y: cam.y + Math.random() * view.h, vx: (Math.random() - .5) * 6, vy: -10 - Math.random() * 20, life: 2, max: 2, size: 2 + Math.random() * 3, color: ['120,160,220', '255,180,210', '200,200,210', '255,230,150'][Math.floor(Math.random() * 4)] });
  if (state.flags.voidT >= 1) { showToast('Мир исчез. Остались фургон, прошлое «я» — и ребёнок.'); updateHUD(); }
}
let autoSaveT = 0;
function update(dt) {
  if (!world) return;
  for (const n of world.npcs) n.visible = !n.cond || n.cond(state);
  if (state.mode === 'world') { updatePlayer(dt); if (state.mode === 'world') checkExits(); const ep = EPS[state.episode]; if (state.mode === 'world' && ep && ep.tick) ep.tick(dt); }
  else player.moving = false;
  if (state.mode === 'world' || state.mode === 'dialogue') {
    for (const n of world.npcs) if (n.visible) updateNPC(n, dt);
    updateParticles(dt); updateCars(dt); updateBirds(dt); updateVoid(dt);
    if (state.nightmareOn) state.nightmare = Math.min(1, state.nightmare + dt / 40);
  }
  if (state.mode === 'world' && !Dlg.active && !forceWalk) { autoSaveT += dt; if (autoSaveT > 4) { autoSaveT = 0; saveGame(true); } }
  updatePrompt();
  updateCamera(dt);
}
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
  gameTime += dt;
  try { update(dt); render(); drawTitleSky(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

// ============================================================
// STATIC STORY AUDIT
// ============================================================
function runStoryAudit() {
  const issues = [], note = m => issues.push(m);
  Object.entries(MAPS).forEach(([id, m]) => {
    if (!m.tiles || !m.tiles.length) { note(`${id}: нет тайлов`); return; }
    const w = m.tiles[0].length;
    if (m.tiles.some(r => r.length !== w)) note(`${id}: строки разной длины`);
    m.tiles.forEach((r, y) => { for (const ch of r) if (!TILES[ch]) note(`${id}: неизвестный тайл «${ch}» в строке ${y}`); });
    const sx = Math.floor(m.spawn.tx), sy = Math.floor(m.spawn.ty + .75), tile = m.tiles[sy] && m.tiles[sy][sx];
    if (!tile || TILES[tile].solid) note(`${id}: точка входа в коллизии (${sx},${sy} = ${tile})`);
    for (const n of m.npcs || []) { const c = charOf(n); if (!CHARS[c]) note(`${id}: NPC ${n.id} → неизвестный персонаж ${c}`); }
    for (const e of m.exits || []) { if (!MAPS[e.to]) note(`${id}: переход в несуществующую карту ${e.to}`); else { const s = e.spawn, t2 = MAPS[e.to].tiles[Math.floor(s.ty + .75)]?.[Math.floor(s.tx)]; if (!t2 || TILES[t2].solid) note(`${id} → ${e.to}: точка появления в коллизии (${s.tx},${s.ty})`); } }
    for (const o of m.objects || []) if (!INTERACTIONS[o.id]) note(`${id}: объект ${o.id} без обработчика`);
  });
  EPISODE_ORDER.forEach(id => { if (!EPISODES[id] || !EPISODES[id].steps.length) note(`${id}: нет этапов`); });
  const names = /(Тим|Даня|Дани|Гер[аы]|Марин|Паш)/;
  const txt = JSON.stringify(EPS) + JSON.stringify(FINAL);
  const m = txt.match(names); if (m) note('Имя в тексте: ' + m[0]);
  Object.entries(EPS).forEach(([id, e]) => { if (!e.start || !e.end || !MAPS[e.realMap]) note(`${id}: неполное описание серии`); });
  if (issues.length) console.warn('[A Dream of a Dream] Проверка контента:', issues);
  else console.info('[A Dream of a Dream] Проверка контента: все карты, переходы и реплики согласованы.');
  return { ok: !issues.length, issues };
}
window.runDreamAudit = runStoryAudit;
window.addEventListener('resize', resize);
loadSettings(); applyTouch(); applyFx(); resize(); refreshTitle(); runStoryAudit(); Audio.music('title');
requestAnimationFrame(loop);
